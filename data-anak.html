<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPANTI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="sidebar offcanvas offcanvas-start" id="sidebarAdmin" tabindex="-1">
        <div class="sidebar-brand">
            <span class="sidebar-logo">SIPANTI</span>
            <span class="sidebar-sub">Panti Asuhan Amal Mulia Qurani</span>
        </div>

        <p class="sidebar-label">Menu</p>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="data-anak.html" class="active">Data Anak</a></li>
        </ul>

        <div class="sidebar-bottom">
            <a href="homepage.html">Logout</a>
        </div>
    </aside>

    <div class="admin-main">
        <div class="admin-topbar">
            <button type="button" class="btn-menu" data-bs-toggle="offcanvas" data-bs-target="#sidebarAdmin" aria-label="Buka menu">&#9776;</button>
            <span class="admin-topbar-title">SIPANTI</span>
        </div>

    <main class="container my-4 data-anak-page">

        <div class="mb-4">
            <h2 class="detail-title">Data Anak Asuh</h2>
            <p class="detail-subtitle">Kelola data anak asuh panti dengan mudah</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <p class="stat-number" id="statTotal">3</p>
                        <p class="stat-label">Total Anak</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <p class="stat-number" id="statAktif">3</p>
                        <p class="stat-label">Aktif</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <p class="stat-number" id="statTidakAktif">0</p>
                        <p class="stat-label">Tidak Aktif</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card toolbar-card mb-4">
            <div class="card-body">

                <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                    <input type="search" class="form-control flex-grow-1" id="inputCari" placeholder="Cari nama anak asuh...">

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-search flex-fill" id="btnCari">Cari</button>
                        <a href="tambah-anak.html" class="btn btn-edit flex-fill">+ Tambah Anak</a>
                    </div>
                </div>

                <div class="filter-chips">
                    <button type="button" class="chip active" id="chipSemua">Semua</button>
                    <button type="button" class="chip" id="chipAktif">Aktif</button>
                    <button type="button" class="chip" id="chipTidakAktif">Tidak Aktif</button>
                </div>

            </div>
        </div>

        <div class="anak-list d-flex flex-column gap-3" id="anakList"></div>

        <p class="data-count text-center" id="dataCount">
            Menampilkan 1-3 dari 3 data
        </p>

    </main>

    <footer>
        <p>SIPANTI - Panti Asuhan Amal Mulia Qurani</p>
    </footer>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
