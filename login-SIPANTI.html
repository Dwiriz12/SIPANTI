<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIPANTI - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SIPANTI</h1>

        <nav>
            <ul>
                <li>
                    <a href="tentang-SIPANTI.html">Tentang Kami</a>
                </li>

                <li>
                    <a href="login-SIPANTI.html" class="active">Login</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="container">

            <div class="login-section">

                <div class="login-card">
                    <img src="foto dokumentasi/logo panti asuhan.png" alt="Logo Panti Asuhan Amal Mulia Qurani" class="logo-login">

                    <h3>Masuk</h3>

                    <p class="login-subtitle">
                        Silakan masuk untuk mengelola data SIPANTI
                    </p>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="nama@email.com">
                            <div class="invalid-feedback">
                                Masukkan email yang valid.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Password">
                            <div class="invalid-feedback">
                                Password wajib diisi.
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="loginIngat">
                            <label class="form-check-label" for="loginIngat">Ingat saya</label>
                        </div>

                        <button type="submit" class="btn btn-login w-100">
                            Masuk
                        </button>

                    </form>

                    <p class="login-footer-text">
                        Belum punya akun? Hubungi pengurus panti
                    </p>
                </div>

            </div>

        </div>

    </main>

    <footer>
        <p>
            SIPANTI - Panti Asuhan Amal Mulia Qurani
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#formLogin").on("submit", function (e) {
                e.preventDefault();

                $("#loginEmail").removeClass("is-invalid");
                $("#loginPassword").removeClass("is-invalid");

                const email = $("#loginEmail").val().trim();
                const password = $("#loginPassword").val().trim();

                let valid = true;

                if (!email) {
                    $("#loginEmail").addClass("is-invalid");
                    valid = false;
                }

                if (!password) {
                    $("#loginPassword").addClass("is-invalid");
                    valid = false;
                }

                if (!valid) {
                    return;
                }

                if (!email.includes("@")) {
                    $("#loginEmail").addClass("is-invalid");
                    return;
                }

                $("#loginEmail, #loginPassword").prop("disabled", true);
                $("#formLogin button[type='submit']").prop("disabled", true).text("Memproses...");

                setTimeout(function () {
                    window.location.href = "data-anak.html";
                }, 1500);
            });

            $("#loginEmail, #loginPassword").on("input", function () {
                $(this).removeClass("is-invalid");
            });
        });
    </script>
</body>

</html>
